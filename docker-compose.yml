version: "3.9"

services:
  env1:
    build:
      context: .
      dockerfile: Dockerfile.env
    ports:
      - "8001:8000"
    restart: unless-stopped
    volumes:
      - logs:/app/logs
      - runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  env2:
    build:
      context: .
      dockerfile: Dockerfile.env
    ports:
      - "8002:8000"
    restart: unless-stopped
    volumes:
      - logs:/app/logs
      - runs:/app/runs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 3s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    depends_on:
      env1:
        condition: service_healthy
      env2:
        condition: service_healthy
    restart: unless-stopped
    environment:
      RUN_MODE: distributed
      ENV_MODE: remote
      BASE_URLS: http://env1:8000/v1,http://env2:8000/v1
      LOG_DIR: /app/logs/runs
      VALIDATE_DETERMINISM: "true"
    volumes:
      - logs:/app/logs
      - runs:/app/runs

volumes:
  logs:
  runs: