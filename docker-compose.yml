version: "3.9"

services:
  # 🌐 Environment API (Flask)
  env:
    build:
      context: .
      dockerfile: Dockerfile.env
    container_name: agent_env
    ports:
      - "8000:8000"
    volumes:
      - ~/agent-sim/logs:/app/logs
      - ~/agent-sim/runs:/app/runs

  # 🧠 Agent Runner (training)
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: agent_runner
    depends_on:
      - env
    environment:
      - ENV_MODE=remote
      - BASE_URL=http://env:8000/v1
      - LOG_DIR=/app/logs/runs
    volumes:
      - ~/agent-sim/logs:/app/logs
      - ~/agent-sim/runs:/app/runs